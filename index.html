<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Điểm danh lớp - Bản thử</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f4f6f8; color: #1f2933; }
    main { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    .nho { color: #52606d; font-size: .9rem; margin: 0 0 20px; }
    .the { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .ok { border-left: 6px solid #1b9e4b; }
    .loi { border-left: 6px solid #d64545; }
    .cho { border-left: 6px solid #d9a400; }
    .canhbao { background: #fff4d6; border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
    .dong { margin: 4px 0; word-break: break-word; }
    pre { white-space: pre-wrap; word-break: break-all; font-size: .8rem; }
  </style>
</head>
<body>
  <main>
    <h1>Điểm danh lớp</h1>
    <p class="nho">Bản thử Giai đoạn 0: kiểm tra đăng nhập Google</p>

    <div id="canhBaoTrinhDuyet" class="canhbao" hidden></div>
    <div class="the"><div id="nutDangNhap"></div></div>
    <div id="ketQua" class="the" hidden></div>

    <details class="the">
      <summary>Thông tin kỹ thuật (gửi kèm khi báo lỗi)</summary>
      <pre id="kyThuat"></pre>
    </details>
  </main>

  <script>
    // ====== CẤU HÌNH: dán 2 giá trị của bạn vào đây ======
    const CLIENT_ID = '92463515262-l6eltbnl7sk9s11b7htpaqa241pjvpge.apps.googleusercontent.com';
    const URL_MAY_CHU = 'https://script.google.com/macros/s/AKfycbyBRb94oCEZoP1_kyKj7YR07oHcJWOVCWctdTE9FVLv_0cFaxITlW0xhDA9cg7-SnMa/exec';

    // ====== Ghi thông tin kỹ thuật để dễ báo lỗi ======
    const nhatKyKyThuat = [];
    function ghiKyThuat(dong) {
      nhatKyKyThuat.push(new Date().toLocaleTimeString('vi-VN') + ' - ' + dong);
      document.getElementById('kyThuat').textContent = nhatKyKyThuat.join('\n');
    }

    // ====== Hiện kết quả (dùng textContent để an toàn, không chèn HTML) ======
    function hienKetQua(loai, cacDong) {
      const hop = document.getElementById('ketQua');
      hop.className = 'the ' + loai;
      hop.hidden = false;
      hop.textContent = '';
      cacDong.forEach(function (chu, i) {
        const p = document.createElement('p');
        p.className = 'dong';
        if (i === 0) p.style.fontWeight = '700';
        p.textContent = chu;
        hop.appendChild(p);
      });
    }

    // ====== Cảnh báo nếu đang mở trong trình duyệt của ứng dụng (Zalo, Facebook...) ======
    function kiemTraTrinhDuyet() {
      const ua = navigator.userAgent;
      ghiKyThuat('Thiết bị: ' + ua);
      if (/Zalo|FBAN|FBAV|FB_IAB|Instagram|Line\/|Messenger/i.test(ua)) {
        const hop = document.getElementById('canhBaoTrinhDuyet');
        hop.hidden = false;
        hop.textContent = 'Có vẻ bạn đang mở link bên trong một ứng dụng (Zalo, Facebook...). ' +
          'Đăng nhập Google có thể bị chặn. Nếu gặp lỗi, hãy bấm menu ba chấm và chọn "Mở bằng trình duyệt" (Chrome hoặc Safari).';
        ghiKyThuat('Phát hiện trình duyệt trong ứng dụng');
      }
    }

    // ====== Sau khi Google trả mã đăng nhập: gửi lên máy chủ kiểm tra ======
    async function xuLyDangNhap(phanHoi) {
      hienKetQua('cho', ['Đang kiểm tra quyền...']);
      ghiKyThuat('Đã nhận mã đăng nhập từ Google, đang gửi lên máy chủ');
      try {
        // Không đặt Content-Type để tránh lỗi CORS với Apps Script
        const res = await fetch(URL_MAY_CHU, {
          method: 'POST',
          body: JSON.stringify({ idToken: phanHoi.credential })
        });
        ghiKyThuat('Máy chủ trả mã HTTP ' + res.status);
        const kq = await res.json();

        if (kq.ok) {
          hienKetQua('ok', [
            'Đăng nhập thành công, bạn có quyền sử dụng',
            'Email đăng nhập: ' + kq.emailDangNhap,
            'Họ tên trong danh sách: ' + kq.hoTenTrongDanhSach,
            'Họ tên trên Google: ' + kq.hoTenGoogle
          ]);
        } else {
          const dong = ['Không vào được: ' + (kq.thongBao || 'Lỗi không rõ')];
          if (kq.emailDangNhap) dong.push('Email bạn vừa đăng nhập: ' + kq.emailDangNhap);
          hienKetQua('loi', dong);
        }
        ghiKyThuat('Kết quả: ' + (kq.ok ? 'được phép' : (kq.maLoi || 'bị từ chối')));
      } catch (loi) {
        ghiKyThuat('Lỗi kết nối: ' + loi.message);
        hienKetQua('loi', [
          'Không kết nối được máy chủ',
          'Hãy chụp màn hình phần "Thông tin kỹ thuật" bên dưới và gửi cho người quản lý.'
        ]);
      }
    }

    // ====== Hiện nút "Đăng nhập bằng Google" ======
    function khoiTaoDangNhap() {
      if (CLIENT_ID.indexOf('DAN-') === 0 || URL_MAY_CHU.indexOf('DAN-') === 0) {
        hienKetQua('loi', ['Chưa dán Client ID hoặc đường link Apps Script vào đầu file index.html.']);
        return;
      }
      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: xuLyDangNhap,
        auto_select: false
      });
      google.accounts.id.renderButton(document.getElementById('nutDangNhap'), {
        theme: 'outline', size: 'large', text: 'signin_with', locale: 'vi', width: 280
      });
      ghiKyThuat('Đã hiện nút đăng nhập');
    }

    kiemTraTrinhDuyet();
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="khoiTaoDangNhap()"></script>
</body>
</html>
